# Sensitivity of D7: expression filter keeps probes detected in >= ceil(0.25 x n_minority_train) samples (primary: 0.5).
# 2 repeats x 5 folds, same seed and splits as repeats 0-1 of the full run; only the filter threshold differs.
name: sens_filter_025
dataset: GSE42568
subset: full
seed: 20260921
cv: {n_splits: 5, n_repeats: 2}
preprocessing: {min_detect_frac_of_minority: 0.25, collapse_rule: max_mean}
top_k: [10, 25, 50]
store_top: 200
n_perm: 10
bootstrap: {n_boot: 2000}
parallel_folds: 2
baseline: {ttest: true, ttest_lr_k: 25}
configs:
  - {id: logreg, model: {name: logreg}, explainers: [coef, shap, perm], role: primary}
  - {id: svm, model: {name: svm}, explainers: [coef, shap, perm], role: primary}
  - {id: rf, model: {name: rf}, explainers: [shap, perm], role: primary}
  - {id: xgb, model: {name: xgb}, explainers: [shap, perm], role: primary}
  - {id: logreg_C0.1, model: {name: logreg, C: 0.1}, explainers: [coef], role: sensitivity}
  - {id: logreg_C100, model: {name: logreg, C: 100}, explainers: [coef], role: sensitivity}
