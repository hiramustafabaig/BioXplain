[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bioxplain"
version = "0.1.0.dev0"
description = "Leakage-safe workflow for studying the stability and cross-cohort replication of ML explanations on gene-expression data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
xai = ["shap>=0.46", "xgboost>=2.0"]
bio = ["gseapy>=1.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
markers = ["integration: uses the real GEO data files (slower, skipped if absent)"]
